# ============================================
# BANCO DE DADOS
# ============================================
# Local: usa localhost/postgres/postgres
# Render: sobrescreve com as variáveis de ambiente SPRING_DATASOURCE_*
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/projetoMilitar}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driverClassName=org.postgresql.Driver

# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.show-sql=true
spring.jpa.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Estratégia de nomenclatura (evita problemas com maiúsculas/minúsculas)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ============================================
# CORS
# ============================================
cors.originPatterns=${CORS_ORIGIN_PATTERNS:http://localhost:8080,http://localhost:8081,http://localhost:19006,http://localhost:3000}